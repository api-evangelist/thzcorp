aid: thzcorp
name: Cambridge Terahertz
description: Cambridge Terahertz (thzcorp.com) is an MIT-spinout physical security company
  building compact, AI-powered terahertz imaging sensors that detect concealed weapons --
  guns, knives, explosives, and 3D-printed weapons -- as people walk naturally through
  entrances, without pat-downs or metal detectors. The 2-pound sensors mount like security
  cameras, serve hospitals, enterprises, and government facilities, and integrate with
  existing VMS and security systems over standard REST APIs, though the company publishes
  no public developer portal or API documentation. Backed by Felicis with a $12M seed
  round and an NSF SBIR Phase II grant.
